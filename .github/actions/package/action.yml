name: package
description: >
  One package of a release for the runner's platform, into build/dist/: the program,
  the part of assets/ it reads, its zip, and for the game its manifest

# The game draws and plays mods/; the server plays by data/ and draws nothing, and its
# scripts are the host's own (none ship: soldatreloaded-scripts has examples). So each
# package holds only what its program reads. The game's comes with the launcher, which
# players start and which keeps the install at the newest release (apps/launcher). Into
# build/dist/:
#
#   soldatreloaded-<platform>/           the game's install, unpacked
#   soldatreloaded-<platform>.zip        what a player downloads
#   manifest.<platform>.json             every file in it, by hash, for the launcher
#   soldatreloaded-server.zip            the server, for Linux alone
#
# The game's install holds its manifest too, as manifest.json, so the launcher knows
# what release it was last brought up to. The server has none: hosts update it by hand.

inputs:
  app:
    description: client or server
    required: true
  version:
    description: the release's version, as its tag (v0.1.0) or without the v
    required: true

runs:
  using: composite
  steps:
    - name: package
      shell: bash
      env:
        APP: ${{ inputs.app }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        VERSION="${VERSION#v}"
        case "$RUNNER_OS" in
          Windows) platform=windows; exe=.exe ;;
          Linux) platform=linux; exe= ;;
          *) echo "::error::no packages for $RUNNER_OS"; exit 1 ;;
        esac
        case "$APP" in
          client) name="soldatreloaded-$platform"; program="soldatreloaded$exe" ;;
          server) name="soldatreloaded-server"; program="soldatreloaded-server" ;;
          *) echo "::error::app is client or server, not $APP"; exit 1 ;;
        esac
        if [ "$APP" = server ] && [ "$platform" != linux ]; then
          echo "::error::the server is released for Linux alone"; exit 1
        fi
        dist=build/dist
        stage="$dist/$name"
        mkdir -p "$stage"

        # The program, built for speed, its libraries linked in (ODIN_FLAGS, from the
        # setup action). The game on Windows is a windowed program, without a console of
        # its own; the server and the launcher are consoles. The version is the one the
        # menu shows and the client names itself by to the web (SOLDATRELOADED_VERSION).
        # On Windows each program carries its resources (apps/resources): the icon, the
        # manifest, and what it is and its version, the release's numbers written into
        # version.h first (0.2.0-beta is 0,2,0,0 and says "0.2.0-beta").
        flags=(-o:speed -vet -define:SOLDATRELOADED_VERSION="$VERSION" ${ODIN_FLAGS:-})
        launcher_flags=(-o:speed -vet ${ODIN_FLAGS:-})
        programs=("$program")
        if [ "$APP" = client ] && [ "$platform" = windows ]; then
          IFS=. read -r major minor patch _ <<< "${VERSION%%[-+]*}"
          printf '#define SR_VERSION_NUMBER %d,%d,%d,0\n#define SR_VERSION_TEXT "%s"\n' \
            "${major:-0}" "${minor:-0}" "${patch:-0}" "$VERSION" > apps/resources/version.h
          flags+=(-subsystem:windows -resource:apps/resources/client.rc)
          launcher_flags+=(-resource:apps/resources/launcher.rc)
        fi
        odin build "apps/$APP" "${flags[@]}" -out:"$stage/$program"
        if [ "$APP" = client ]; then
          odin build apps/launcher "${launcher_flags[@]}" -out:"$stage/soldatreloaded-launcher$exe"
          programs+=("soldatreloaded-launcher$exe")
        fi
        rm -f "$stage"/*.pdb "$stage"/*.exp "$stage"/*.lib

        # Nothing a player would have to install: the programs ask the system only for
        # what every machine has. Their libraries are listed, and any of ours found
        # outside them, or the Visual C++ runtime (apps/client/crt_windows.odin), fails
        # the release.
        for p in "${programs[@]}"; do
          if [ "$platform" = linux ]; then deps=$(ldd "$stage/$p"); else deps=$(llvm-objdump -p "$stage/$p" | grep 'DLL Name'); fi
          echo "$p:"; echo "$deps"
          if grep -iE 'raylib|enet|curl|mbed|libz\.|lua|sqlite|vcruntime|msvcp' <<< "$deps"; then
            echo "::error::$p links a library a player would need installed"
            exit 1
          fi
        done

        # What of assets/ it reads.
        cp -r assets/data "$stage/"
        if [ "$APP" = client ]; then
          mkdir -p "$stage/mods"
          cp -r assets/mods/classic "$stage/mods/" # the game's own look and sound; a player's mods sit beside it
        else
          cp assets/server.config.mjson assets/weapons.ini "$stage/" # its config and weapons at their defaults, each setting explained
        fi
        cp license.md "$stage/"
        printf '%s\n' "$VERSION" > "$stage/version.txt"

        # The game's manifest: every file of the install by its path, size and SHA-256,
        # sorted by path, so the launcher can tell what an install has from what the
        # release ships. The install keeps a copy, which lists every file but itself.
        if [ "$APP" = client ]; then
          manifest="$dist/manifest.$platform.json"
          (
            cd "$stage"
            find . -type f -printf '%P\0' | LC_ALL=C sort -z > ../files.list
            tr '\0' '\n' < ../files.list > ../paths.list
            xargs -0 stat -c '%s' < ../files.list > ../sizes.list
            xargs -0 sha256sum -b < ../files.list | sed 's/ \*.*$//' > ../hashes.list
          )
          {
            printf '{\n'
            printf '  "version": "%s",\n' "$VERSION"
            printf '  "files": [\n'
            paste -d '\t' "$dist/paths.list" "$dist/sizes.list" "$dist/hashes.list" |
              awk -F '\t' '{
                gsub(/\\/, "\\\\", $1); gsub(/"/, "\\\"", $1)
                printf "%s    {\"path\": \"%s\", \"size\": %s, \"sha256\": \"%s\"}", (NR > 1 ? ",\n" : ""), $1, $2, $3
              } END { printf "\n" }'
            printf '  ]\n'
            printf '}\n'
          } > "$manifest"
          rm -f "$dist"/*.list
          cp "$manifest" "$stage/manifest.json"
        fi

        # The zip. The game's files are in a "Soldat Reloaded" folder, so a player who
        # unpacks it gets the install as one folder; the launcher reads them from there
        # (apps/launcher, ARCHIVE_FOLDER). The server's are at its root, which the hosted
        # servers' image unpacks as the server's directory.
        if [ "$APP" = client ]; then
          folder="Soldat Reloaded"
          wrap="$dist/wrap-$name"
          rm -rf "$wrap"
          mkdir -p "$wrap"
          cp -r "$stage" "$wrap/$folder"
          (
            cd "$wrap"
            if command -v zip > /dev/null; then zip -qr -9 "../$name.zip" "$folder"
            else 7z a -tzip -mx=9 -bso0 "../$name.zip" "$folder" > /dev/null
            fi
          )
          rm -rf "$wrap"
        else
          (
            cd "$stage"
            if command -v zip > /dev/null; then zip -qr -9 "../$name.zip" .
            else 7z a -tzip -mx=9 -bso0 "../$name.zip" . > /dev/null
            fi
          )
        fi
        echo "$dist/$name.zip: $(find "$stage" -type f | wc -l) files"
