name: setup
description: >
  Odin, and on Linux the libraries the programs link, built to be linked in rather
  than looked for on a player's machine

# A release's programs carry their libraries inside them: a player installs nothing.
# Odin's vendor collection has most of them as static libraries already: on Windows
# everything the game and the launcher link (raylib, curl), on Linux raylib and Lua. What
# Linux lacks is built here from pinned sources, checked against their published hashes,
# and cached: ENet for the server, and curl on mbedTLS for the server and the launcher.
# SQLite, the scripts' databases (apps/server/db.odin), is built on both, from its
# amalgamation: on Linux with the rest, on Windows as sqlite3.lib on the linker's path.
#
# Windows' raylib is built here too, over Odin's: the one Odin ships is raylib's own
# release, whose Visual Studio project asks for AVX2, and a game built on it dies at its
# first frame on a CPU before 2013 (Ivy Bridge and older), an illegal instruction.
# raylib's CMake asks for nothing beyond what every x64 CPU has.
#
# The step exports ODIN_FLAGS, which every build and test passes to Odin: the directory
# the static libraries are in, searched before the system's. What stays the system's is
# what every machine has: the C library, and on Linux X11 and OpenGL.

runs:
  using: composite
  steps:
    - name: odin
      uses: laytan/setup-odin@v2
      with:
        release: dev-2026-09
        token: ${{ github.token }} # without one it can't download a release

    # Odin's Linux release leaves stb, which the game's fonts and images use, to be
    # compiled where it is installed.
    - name: stb
      if: runner.os == 'Linux'
      shell: bash
      run: bash "$(odin root)/vendor/stb/src/build_stb.sh" unix

    # raylib at the version Odin's bindings are for (raylib.odin's VERSION), linked
    # against the same C runtime as the library it replaces (/MD).
    - name: raylib version
      if: runner.os == 'Windows'
      shell: bash
      run: |
        {
          echo "RAYLIB_TAG=6.0"
          echo "RAYLIB_COMMIT=dbc56a87da87d973a9c5baa4e7438a9d20121d28"
          echo "RAYLIB_LIB=$HOME/raylib-lib"
        } >> "$GITHUB_ENV"

    - name: raylib cache
      id: raylib-cache
      if: runner.os == 'Windows'
      uses: actions/cache@v5
      with:
        path: ~/raylib-lib
        key: raylib-${{ runner.os }}-${{ env.RAYLIB_COMMIT }}

    - name: build raylib
      if: runner.os == 'Windows' && steps.raylib-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RAYLIB_LIB" && cd "$RUNNER_TEMP"
        git clone -q --depth 1 --branch "$RAYLIB_TAG" https://github.com/raysan5/raylib.git
        test "$(git -C raylib rev-parse HEAD)" = "$RAYLIB_COMMIT"
        cmake -S raylib -B raylib-build -A x64 -DBUILD_EXAMPLES=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL
        cmake --build raylib-build --config Release --target raylib -j
        cp raylib-build/raylib/Release/raylib.lib "$RAYLIB_LIB/"

    - name: link raylib
      if: runner.os == 'Windows'
      shell: bash
      run: cp "$RAYLIB_LIB/raylib.lib" "$(odin root)/vendor/raylib/windows/raylib.lib"

    # SQLite's amalgamation, one C file, at a pinned version checked against its hash.
    - name: sqlite version
      shell: bash
      run: |
        {
          echo "SQLITE_VERSION=3530400"
          echo "SQLITE_YEAR=2026"
          echo "SQLITE_SHA256=1e71ddf93849c6a6ecf58b827c0692073d2dd7ee40196158068f7b29f422e87d"
        } >> "$GITHUB_ENV"

    - name: sqlite cache
      id: sqlite-cache
      if: runner.os == 'Windows'
      uses: actions/cache@v5
      with:
        path: ~/sqlite-lib
        key: sqlite-${{ runner.os }}-${{ env.SQLITE_VERSION }}

    # Against the same C runtime as raylib's (/MD), as the programs are.
    - name: build sqlite
      if: runner.os == 'Windows' && steps.sqlite-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$HOME/sqlite-lib" && cd "$RUNNER_TEMP"
        curl -fsSL "https://www.sqlite.org/$SQLITE_YEAR/sqlite-amalgamation-$SQLITE_VERSION.zip" -o sqlite.zip
        echo "$SQLITE_SHA256  sqlite.zip" | sha256sum -c -
        unzip -q sqlite.zip
        cd "sqlite-amalgamation-$SQLITE_VERSION"
        printf '%s\n' 'cmake_minimum_required(VERSION 3.16)' 'project(sqlite3 C)' \
          'add_library(sqlite3 STATIC sqlite3.c)' \
          'target_compile_definitions(sqlite3 PRIVATE SQLITE_THREADSAFE=1 SQLITE_OMIT_LOAD_EXTENSION)' > CMakeLists.txt
        cmake -S . -B build -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL
        cmake --build build --config Release -j
        cp build/Release/sqlite3.lib "$HOME/sqlite-lib/"

    - name: link sqlite
      if: runner.os == 'Windows'
      shell: bash
      run: echo "ODIN_FLAGS=-extra-linker-flags:/LIBPATH:$(cygpath -w "$HOME/sqlite-lib")" >> "$GITHUB_ENV"

    - name: versions
      if: runner.os == 'Linux'
      shell: bash
      run: |
        {
          echo "ENET_TAG=v1.3.17"
          echo "ENET_COMMIT=e0e7045b7e056b454b5093cb34df49dc4cee0bee"
          echo "MBEDTLS_VERSION=3.6.7"
          echo "MBEDTLS_SHA256=a7e8bcbec0e6f761b4af24f25677626b35f762f68eef79c08677a363212d11f6"
          echo "CURL_VERSION=8.22.0"
          echo "CURL_SHA256=d54dd598bf05927a726deb38df31c6a255ba83ff1de57c5d1464dac3ed8f44a1"
          echo "STATIC_LIBS=$HOME/static-libs"
        } >> "$GITHUB_ENV"

    - name: cache
      id: cache
      if: runner.os == 'Linux'
      uses: actions/cache@v5
      with:
        path: ~/static-libs
        key: static-libs-${{ runner.os }}-enet${{ env.ENET_TAG }}-mbedtls${{ env.MBEDTLS_VERSION }}-curl${{ env.CURL_VERSION }}-sqlite${{ env.SQLITE_VERSION }}

    - name: packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -yq libx11-dev libgl-dev zlib1g-dev

    - name: build enet, mbedtls, curl and sqlite
      if: runner.os == 'Linux' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$STATIC_LIBS/lib" && cd "$RUNNER_TEMP"
        static=(-DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_LIBDIR=lib)

        git clone -q --depth 1 --branch "$ENET_TAG" https://github.com/lsalzman/enet.git
        test "$(git -C enet rev-parse HEAD)" = "$ENET_COMMIT"
        cmake -S enet -B enet-build "${static[@]}"
        cmake --build enet-build -j
        cp enet-build/libenet.a "$STATIC_LIBS/lib/"

        curl -fsSL "https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-$MBEDTLS_VERSION/mbedtls-$MBEDTLS_VERSION.tar.bz2" -o mbedtls.tar.bz2
        echo "$MBEDTLS_SHA256  mbedtls.tar.bz2" | sha256sum -c -
        tar -xjf mbedtls.tar.bz2
        cmake -S "mbedtls-$MBEDTLS_VERSION" -B mbedtls-build "${static[@]}" -DCMAKE_INSTALL_PREFIX="$STATIC_LIBS" \
          -DENABLE_PROGRAMS=OFF -DENABLE_TESTING=OFF -DGEN_FILES=OFF
        cmake --build mbedtls-build -j
        cmake --install mbedtls-build

        # curl for HTTPS alone, on mbedTLS, as Odin's bindings link it; nothing else.
        curl -fsSL "https://github.com/curl/curl/releases/download/curl-${CURL_VERSION//./_}/curl-$CURL_VERSION.tar.gz" -o curl.tar.gz
        echo "$CURL_SHA256  curl.tar.gz" | sha256sum -c -
        tar -xzf curl.tar.gz
        cmake -S "curl-$CURL_VERSION" -B curl-build "${static[@]}" -DCMAKE_INSTALL_PREFIX="$STATIC_LIBS" -DCMAKE_PREFIX_PATH="$STATIC_LIBS" \
          -DBUILD_CURL_EXE=OFF -DBUILD_TESTING=OFF -DBUILD_LIBCURL_DOCS=OFF -DBUILD_MISC_DOCS=OFF -DENABLE_CURL_MANUAL=OFF \
          -DHTTP_ONLY=ON -DCURL_USE_MBEDTLS=ON -DCURL_USE_OPENSSL=OFF -DCURL_ZLIB=ON \
          -DUSE_NGHTTP2=OFF -DUSE_LIBIDN2=OFF -DCURL_USE_LIBPSL=OFF -DCURL_USE_LIBSSH2=OFF -DCURL_USE_GSSAPI=OFF \
          -DCURL_ZSTD=OFF -DCURL_BROTLI=OFF -DENABLE_ARES=OFF -DCURL_DISABLE_LDAP=ON \
          -DCURL_CA_BUNDLE=none -DCURL_CA_PATH=none
        cmake --build curl-build -j
        cmake --install curl-build

        cp "$(gcc -print-file-name=libz.a)" "$STATIC_LIBS/lib/" # zlib, which curl uses

        curl -fsSL "https://www.sqlite.org/$SQLITE_YEAR/sqlite-amalgamation-$SQLITE_VERSION.zip" -o sqlite.zip
        echo "$SQLITE_SHA256  sqlite.zip" | sha256sum -c -
        unzip -q sqlite.zip
        gcc -c -O2 -fPIC -DSQLITE_THREADSAFE=1 -DSQLITE_OMIT_LOAD_EXTENSION \
          "sqlite-amalgamation-$SQLITE_VERSION/sqlite3.c" -o sqlite3.o
        ar rcs "$STATIC_LIBS/lib/libsqlite3.a" sqlite3.o

    - name: link the static libraries
      if: runner.os == 'Linux'
      shell: bash
      run: |
        ls "$STATIC_LIBS/lib"/*.a
        echo "ODIN_FLAGS=-extra-linker-flags:-L$STATIC_LIBS/lib" >> "$GITHUB_ENV"
